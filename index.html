<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jolm.org</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #f4f1ff;
      background: linear-gradient(135deg, #17152b, #313b62);
      font: 17px/1.6 system-ui, sans-serif;
    }

    main {
      width: min(100%, 620px);
      padding: 48px;
      border: 1px solid #ffffff28;
      border-radius: 24px;
      background: #ffffff0d;
      box-shadow: 0 24px 80px #0005;
    }

    .label {
      color: #b7b5d3;
      font-size: 14px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1.05;
    }

    p { color: #d1cfe2; }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      color: #17152b;
      background: #c8f169;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #dcff8d; }

    footer {
      margin-top: 38px;
      color: #aaa8c4;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">A small corner of the internet</div>
    <h1 id="welcome">Hello, internet.</h1>
    <p>There’s not much here yet. That’s part of the charm.</p>
    <button id="shuffle">Show me another hello</button>
    <footer>Made with HTML, CSS, and a little randomness.</footer>
  </main>

  <script>
    const hellos = [
      "Hello, internet.",
      "You found the page.",
      "Welcome, curious human.",
      "A little website says hi.",
      "The pixels are pleased to see you."
    ];

    function showRandomHello() {
      const choice = hellos[Math.floor(Math.random() * hellos.length)];
      document.getElementById("welcome").textContent = choice;
    }

    showRandomHello();
    document.getElementById("shuffle").addEventListener("click", showRandomHello);
  </script>
</body>
</html>
